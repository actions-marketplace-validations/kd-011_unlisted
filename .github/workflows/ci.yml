name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build (static)
        run: CGO_ENABLED=0 go build -trimpath -o unlisted .
      - name: demo exits 1 with findings
        run: |
          set +e
          ./unlisted check -f demo/registry.yml --config-root demo --no-color
          test $? -eq 1
      - name: cross-compile
        run: make dist
