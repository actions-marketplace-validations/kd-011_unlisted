name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A merge made with GITHUB_TOKEN (auto-merge) does not trigger the push run,
  # so this keeps the badge honest.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test (ubuntu-latest, go 1.22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build (static)
        run: CGO_ENABLED=0 go build -trimpath -o unlisted .
      - name: demo exits 1 with findings
        run: |
          set +e
          ./unlisted check -f demo/registry.yml --config-root demo --no-color
          test $? -eq 1
      - name: cross-compile
        run: make dist
