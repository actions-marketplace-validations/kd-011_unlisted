version: 2

project_name: unlisted

before:
  hooks:
    - go vet ./...
    - go test ./...

builds:
  - main: .
    binary: unlisted
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/kd-011/unlisted/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "unlisted_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  disable: true
