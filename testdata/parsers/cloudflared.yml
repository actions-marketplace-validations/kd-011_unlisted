# A tunnel config with the awkward cases.
tunnel: 11111111-2222-3333-4444-555555555555
credentials-file: /etc/cloudflared/creds.json

ingress:
  - hostname: app.example.com
    service: http://localhost:8080
  - hostname: "Files.Example.com"
    service: http://127.0.0.1:8090
  - hostname: guarded.example.com
    service: http://localhost:4000
    originRequest:
      access:
        required: true
        teamName: example
  - hostname: nas.example.com
    service: https://192.168.1.20:5001
  - hostname: sock.example.com
    service: unix:/run/app.sock
  - hostname: blocked.example.com
    service: http_status:403
  - hostname: "*.wild.example.com"
    service: http://localhost:80
  - service: http_status:404
