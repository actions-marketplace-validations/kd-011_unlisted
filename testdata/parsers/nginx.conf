http {
    upstream backend {
        server 127.0.0.1:9000 weight=2;
        server 127.0.0.1:9001 backup;
    }

    # http -> https redirect for the same host
    server {
        listen 80;
        server_name app.example.com www.app.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name app.example.com;
        location / {
            proxy_pass http://127.0.0.1:8080;
        }
        location /admin/ {
            auth_basic "admin only";
            proxy_pass http://127.0.0.1:8081;
        }
    }

    server {
        listen 443 ssl;
        server_name secure.example.com;
        auth_request /auth;
        location / {
            proxy_pass http://backend;
        }
        location = /auth {
            internal;
            proxy_pass http://127.0.0.1:9091/verify;
        }
    }

    server {
        listen 443 ssl;
        server_name off.example.com;
        location / {
            auth_basic off;
            proxy_pass http://localhost:7000;
        }
    }

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 443 ssl;
        server_name ~^(?<sub>.+)\.regex\.example.com$ dyn.example.com;
        location / {
            proxy_pass http://$sub.internal:80;
        }
    }

    server {
        listen 443 ssl;
        server_name only-sub.example.com;
        location /api/ {
            proxy_pass http://127.0.0.1:6000;
        }
    }
}
